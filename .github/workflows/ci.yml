name: ci

# No path filters. Repo invariants depend on nearly every tracked file, and an
# incomplete filter is how the manifest drift reached main in the first place.
on:
  push:
  pull_request:

jobs:
  # shellcheck is platform independent, so one runner is enough.
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf '%s\n' "${files[@]}"
          shellcheck "${files[@]}"

  validate:
    name: repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/repo.sh
      - run: bash tests/before-and-after.sh
      - run: bash tests/ruver-qa.sh
      - run: bash tests/ruver-code-review.sh

  cli:
    name: cli (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/install.sh
