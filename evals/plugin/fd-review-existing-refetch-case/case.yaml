schema_version: "1.0"
name: fd-review-existing-refetch-case
description: 'Internal delivery review with an existing behavioral test for failed refresh.'
expected_outcome: 'Review credits the existing refresh assertion and accepts the ticket proof.'
tags: [fd-test-proof]
context:
  scaffold_script: stage-contract.sh
execution:
  allowed_tools: [Read]
  max_turns: 8
  timeout_seconds: 90
  prompt: |
    Read `reviewer.md` and `LESSONS.md` in the workspace root. Apply them as
    Bulma's internal reviewer. Return both verdicts and any findings for this
    snapshot. The excerpts and receipts below are the review input.

    The folder picker must show Retry when the initial load fails. If a background
    refresh fails with data in cache, the listed folders must remain selectable.
    The query retains cached data and can return both `data` and `isError: true`.
    Initial loading is handled outside this excerpt. The only product change is
    the new branch using the shared RetryNotice. The existing folder list accepts
    an absent list as empty and is specific to this picker.

    `FolderPicker.tsx`:

    ```tsx
    const { data, isError, refetch } = useFolders();
    if (isError && data === undefined) return <RetryNotice onRetry={() => refetch()} />;
    return <FolderList folders={data} onSelect={selectFolder} />;
    ```

    The test uses the real query client with automatic retries disabled. The new
    first-load case rejects the loader, clicks Retry, and asserts the successful
    retry displays the loaded folder. It failed on the base because Retry was
    absent. The unchanged refresh case loads `Planning`, triggers a refetch that
    rejects, and waits for the query's `isRefetchError` with `Planning` still in
    cache. It then clicks `Planning` and checks the selected folder ID.

    The unit receipt for the reviewed snapshot `b620a17` lists all three cases in
    `FolderPicker.test.tsx`: initial success PASS, new first-load retry PASS,
    existing cached refresh PASS. Exit 0, 0 skipped.
graders:
  - type: tool_used
    name: reviewer-contract-read
    tool: Read
    input_match: 'reviewer\.md'
    min: 1
  - type: llm
    name: behavior
    criteria: |
      PASS if both verdicts pass and the review credits the unchanged component test
      for observing selection after a failed refresh with cached rows. FAIL if review
      requires a duplicate test, mistakes provider mock setup for the observable
      selection assertion, or fails solely because a generic edge case is absent.
